<!doctype html>
<html lang="{{language}}" class="login-page">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="theme-color"
      content="#e85e2a"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#1c1b19"
      media="(prefers-color-scheme: dark)"
    />
    <link rel="stylesheet" href="/theme.css?v=system-dark-v1" />
    <title data-i18n="login.title">{{login.title}}</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      * {
        box-sizing: border-box;
      }
      html {
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        color: var(--ink);
        background: var(--cream);
      }
      body {
        min-height: 100vh;
        min-height: 100svh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: max(24px, env(safe-area-inset-top))
          max(24px, env(safe-area-inset-right))
          max(24px, env(safe-area-inset-bottom))
          max(24px, env(safe-area-inset-left));
        background:
          radial-gradient(
            circle at 15% 10%,
            var(--login-glow) 0,
            transparent 34%
          ),
          var(--cream);
      }
      main {
        width: min(100%, 560px);
        background: var(--paper);
        border: 1px solid var(--line);
        padding: clamp(32px, 6vw, 58px);
        box-shadow: 0 24px 70px #18211d12;
      }
      .mark {
        height: 35px;
        display: flex;
        align-items: center;
        gap: 4px;
        margin-bottom: 36px;
      }
      .mark i {
        display: block;
        width: 4px;
        border-radius: 4px;
        background: var(--orange);
      }
      .mark i:nth-child(1) {
        height: 14px;
      }
      .mark i:nth-child(2) {
        height: 27px;
      }
      .mark i:nth-child(3) {
        height: 35px;
      }
      .mark i:nth-child(4) {
        height: 20px;
      }
      h1 {
        font:
          600 clamp(44px, 8vw, 64px) / 0.95 Georgia,
          serif;
        letter-spacing: -0.04em;
        margin: 0 0 16px;
      }
      .intro {
        color: var(--muted);
        font-size: 15px;
        line-height: 1.65;
        margin: 0 0 34px;
      }
      label {
        display: block;
        font-size: 12px;
        font-weight: 700;
        margin-bottom: 9px;
      }
      form label:not(:first-child) {
        margin-top: 18px;
      }
      input {
        display: block;
        width: 100%;
        height: 52px;
        border: 1px solid var(--control-border);
        background: var(--control-surface);
        color: var(--ink);
        padding: 0 15px;
        font-family: inherit;
        font-size: 16px;
        line-height: 1;
        border-radius: 0;
        -webkit-appearance: none;
        appearance: none;
      }
      input:focus {
        outline: 3px solid var(--focus);
        border-color: var(--orange);
      }
      button {
        width: 100%;
        height: 52px;
        border: 0;
        background: var(--action-surface);
        color: var(--action-text);
        font-family: inherit;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
        margin-top: 20px;
        touch-action: manipulation;
      }
      button:hover {
        background: var(--orange);
        color: var(--accent-action-text);
      }
      button:focus-visible {
        outline: 3px solid var(--focus);
        outline-offset: 3px;
      }
      .error {
        display: none;
        color: var(--error);
        background: var(--error-surface);
        padding: 11px 13px;
        margin: 0 0 20px;
        font-size: 13px;
      }
      .error.visible {
        display: block;
      }
      .access-note {
        color: var(--muted);
        font-size: 12px;
        line-height: 1.6;
        margin: 16px 0 0;
      }
      .access-note a {
        color: var(--orange);
        text-underline-offset: 3px;
      }
      .access-note a:hover {
        color: var(--ink);
      }
      .access-note a:focus-visible,
      .maker-links a:focus-visible {
        outline: 3px solid var(--focus);
        outline-offset: 2px;
      }
      .maker-note {
        margin-top: 28px;
        padding-top: 24px;
        border-top: 1px solid var(--line);
      }
      .maker-note p {
        color: var(--muted);
        font-size: 12px;
        line-height: 1.65;
        margin: 0;
      }
      .maker-links {
        display: flex;
        align-items: center;
        justify-content: center;
        flex-wrap: wrap;
        gap: 0 8px;
        margin-top: 14px;
        font:
          500 10px/1.4 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      .maker-links a {
        display: inline-flex;
        align-items: center;
        min-height: 32px;
        padding: 0 2px;
        color: var(--muted);
        text-decoration: none;
      }
      .maker-links a:hover {
        color: var(--orange);
      }
      .maker-links span {
        color: var(--line);
      }
      .maker-note .build-sha {
        margin: 4px 0 0;
        color: var(--muted);
        font:
          500 9px/1.4 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
        letter-spacing: 0.08em;
        text-align: center;
        text-transform: uppercase;
        opacity: 0.65;
      }
      @media (max-width: 480px) {
        body {
          place-items: start center;
          padding: max(16px, env(safe-area-inset-top))
            max(16px, env(safe-area-inset-right))
            max(16px, env(safe-area-inset-bottom))
            max(16px, env(safe-area-inset-left));
        }
        main {
          margin: auto 0;
          padding: 32px 26px;
        }
        .mark {
          margin-bottom: 30px;
        }
        h1 {
          font-size: 42px;
        }
        .intro {
          font-size: 14px;
          margin-bottom: 30px;
        }
        .maker-note {
          margin-top: 24px;
          padding-top: 20px;
        }
        .maker-links {
          margin-top: 10px;
        }
        .maker-links a {
          min-height: 44px;
        }
      }
    </style>
    <script type="module" src="/localize.js"></script>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
      <h1 data-i18n="login.heading">{{login.heading}}</h1>
      <p class="intro" data-i18n="login.intro">{{login.intro}}</p>
      <p id="login-error" class="error" role="alert" data-i18n="login.error">
        {{login.error}}
      </p>
      <form method="post" action="/login">
        <label for="username" data-i18n="login.username"
          >{{login.username}}</label
        >
        <input
          id="username"
          name="username"
          type="text"
          required
          autofocus
          autocomplete="username"
          autocapitalize="none"
          spellcheck="false"
        />
        <label for="password" data-i18n="login.password"
          >{{login.password}}</label
        >
        <input
          id="password"
          name="password"
          type="password"
          required
          autocomplete="current-password"
        />
        <button type="submit" data-i18n="login.submit">{{login.submit}}</button>
      </form>
      <p class="access-note">
        <span data-i18n="login.accessPrompt">{{login.accessPrompt}}</span>
        <a
          href="https://www.linkedin.com/in/rogier-slag/"
          target="_blank"
          rel="me noopener"
          data-i18n="login.contactLink"
          >{{login.contactLink}}</a
        >
        <span data-i18n="login.accessSuffix">{{login.accessSuffix}}</span>
      </p>
      <aside
        class="maker-note"
        aria-label="{{maker.title}}"
        data-i18n-aria-label="maker.title"
      >
        <p data-i18n="maker.description">{{maker.description}}</p>
        <nav
          class="maker-links"
          aria-label="{{maker.linksLabel}}"
          data-i18n-aria-label="maker.linksLabel"
        >
          <a
            href="https://lnkd.in/p/ekHBDVk9"
            target="_blank"
            rel="noopener"
            data-i18n="maker.story"
            >{{maker.story}}</a
          >
          <span aria-hidden="true">·</span>
          <a
            href="https://www.linkedin.com/in/rogier-slag/"
            target="_blank"
            rel="me noopener"
            >LinkedIn</a
          >
          <span aria-hidden="true">·</span>
          <a
            href="https://github.com/rogierslag"
            target="_blank"
            rel="me noopener"
            >GitHub</a
          >
          <span aria-hidden="true">·</span>
          <a
            href="https://github.com/rogierslag/podcast2article"
            target="_blank"
            rel="noopener"
            data-i18n="maker.sourceCode"
            >{{maker.sourceCode}}</a
          >
        </nav>
        <!-- GIT_SHA -->
      </aside>
    </main>
    <script>
      if (new URLSearchParams(location.search).has("error")) {
        document.querySelector("#login-error").classList.add("visible");
      }
    </script>
  </body>
</html>
