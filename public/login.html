<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e85e2a">
  <title>Inloggen — Podcast2Article</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    :root{--cream:#f4f0e8;--paper:#fffdf8;--ink:#18211d;--muted:#69726d;--orange:#e85e2a;--line:#d8d4ca}*{box-sizing:border-box}html{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:var(--cream)}body{min-height:100vh;min-height:100svh;margin:0;display:grid;place-items:center;padding:max(24px,env(safe-area-inset-top)) max(24px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(24px,env(safe-area-inset-left));background:radial-gradient(circle at 15% 10%,#fff7ea 0,transparent 34%),var(--cream)}main{width:min(100%,430px);background:var(--paper);border:1px solid var(--line);padding:clamp(30px,7vw,52px);box-shadow:0 24px 70px #18211d12}.mark{height:35px;display:flex;align-items:center;gap:4px;margin-bottom:44px}.mark i{display:block;width:4px;border-radius:4px;background:var(--orange)}.mark i:nth-child(1){height:14px}.mark i:nth-child(2){height:27px}.mark i:nth-child(3){height:35px}.mark i:nth-child(4){height:20px}h1{font:600 clamp(38px,10vw,55px)/.95 Georgia,serif;letter-spacing:-.04em;margin:0 0 16px}p{color:var(--muted);font-size:14px;line-height:1.6;margin:0 0 32px}label{display:block;font-size:12px;font-weight:700;margin-bottom:9px}form label:not(:first-child){margin-top:18px}input{display:block;width:100%;height:52px;border:1px solid var(--line);background:white;padding:0 15px;font-family:inherit;font-size:16px;line-height:1;border-radius:0;-webkit-appearance:none;appearance:none}input:focus{outline:3px solid #e85e2a35;border-color:var(--orange)}button{width:100%;height:52px;border:0;background:var(--ink);color:white;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;margin-top:20px;touch-action:manipulation}button:hover{background:var(--orange)}.error{display:none;color:#a33426;background:#f9e9e3;padding:11px 13px;margin:0 0 20px;font-size:13px}.error.visible{display:block}.maker-links{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:0 8px;margin-top:28px;padding-top:14px;border-top:1px solid var(--line);font:500 10px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.06em;text-transform:uppercase}.maker-links a{display:inline-flex;align-items:center;min-height:32px;padding:0 2px;color:var(--muted);text-decoration:none}.maker-links a:hover{color:var(--orange)}.maker-links a:focus-visible{outline:3px solid #e85e2a55;outline-offset:2px}.maker-links span{color:var(--line)}@media(max-width:480px){body{place-items:start center;padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}main{margin:auto 0;padding:32px 26px}.mark{margin-bottom:34px}h1{font-size:42px}.maker-links{margin-top:24px;padding-top:10px}.maker-links a{min-height:44px}}
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <h1>Welkom terug.</h1>
    <p>Log in om je opnames, transcripties en artikelen te bekijken.</p>
    <p id="login-error" class="error" role="alert">Die gebruikersnaam of dat wachtwoord klopt niet. Probeer het opnieuw.</p>
    <form method="post" action="/login">
      <label for="username">Gebruikersnaam</label>
      <input id="username" name="username" type="text" required autofocus autocomplete="username" autocapitalize="none" spellcheck="false">
      <label for="password">Wachtwoord</label>
      <input id="password" name="password" type="password" required autocomplete="current-password">
      <button type="submit">Inloggen</button>
    </form>
    <nav class="maker-links" aria-label="Over de maker en broncode">
      <a href="https://www.linkedin.com/in/rogier-slag/" target="_blank" rel="me noopener">LinkedIn</a>
      <span aria-hidden="true">·</span>
      <a href="https://github.com/rogierslag" target="_blank" rel="me noopener">GitHub</a>
      <span aria-hidden="true">·</span>
      <a href="https://github.com/rogierslag/podcast2article" target="_blank" rel="noopener">Broncode</a>
    </nav>
  </main>
  <script>if(new URLSearchParams(location.search).has("error"))document.querySelector("#login-error").classList.add("visible");</script>
</body>
</html>
