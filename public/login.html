<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e85e2a">
  <title>Inloggen — Podcast2Article</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    :root{--cream:#f4f0e8;--paper:#fffdf8;--ink:#18211d;--muted:#69726d;--orange:#e85e2a;--line:#d8d4ca}*{box-sizing:border-box}html{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:var(--cream)}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 15% 10%,#fff7ea 0,transparent 34%),var(--cream)}main{width:min(100%,430px);background:var(--paper);border:1px solid var(--line);padding:clamp(30px,7vw,52px);box-shadow:0 24px 70px #18211d12}.mark{height:35px;display:flex;align-items:center;gap:4px;margin-bottom:44px}.mark i{display:block;width:4px;border-radius:4px;background:var(--orange)}.mark i:nth-child(1){height:14px}.mark i:nth-child(2){height:27px}.mark i:nth-child(3){height:35px}.mark i:nth-child(4){height:20px}h1{font:600 clamp(38px,10vw,55px)/.95 Georgia,serif;letter-spacing:-.04em;margin:0 0 16px}p{color:var(--muted);font-size:14px;line-height:1.6;margin:0 0 32px}label{display:block;font-size:12px;font-weight:700;margin-bottom:9px}input{display:block;width:100%;height:52px;border:1px solid var(--line);background:white;padding:0 15px;font:16px inherit;border-radius:0}input:focus{outline:3px solid #e85e2a35;border-color:var(--orange)}button{width:100%;height:52px;border:0;background:var(--ink);color:white;font:700 13px inherit;cursor:pointer;margin-top:14px}button:hover{background:var(--orange)}.error{display:none;color:#a33426;background:#f9e9e3;padding:11px 13px;margin:0 0 20px;font-size:13px}.error.visible{display:block}
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <h1>Welkom terug.</h1>
    <p>Log in om je opnames, transcripties en artikelen te bekijken.</p>
    <p id="login-error" class="error" role="alert">Dat wachtwoord klopt niet. Probeer het opnieuw.</p>
    <form method="post" action="/login">
      <label for="password">Wachtwoord</label>
      <input id="password" name="password" type="password" required autofocus autocomplete="current-password">
      <button type="submit">Inloggen</button>
    </form>
  </main>
  <script>if(new URLSearchParams(location.search).has("error"))document.querySelector("#login-error").classList.add("visible");</script>
</body>
</html>
