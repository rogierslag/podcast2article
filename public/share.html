<!doctype html>
<html lang="{{language}}">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=contain"
    />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="theme-color"
      content="#e85e2a"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#1c1b19"
      media="(prefers-color-scheme: dark)"
    />
    <meta name="robots" content="noindex, nofollow" />
    <!-- SHARE_METADATA -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/theme.css?v=system-dark-v1" />
    <link rel="stylesheet" href="/styles.css?v=system-dark-v1" />
    <link rel="stylesheet" href="/share.css" />
    <script src="/share.js?v=locale-v1" type="module"></script>
  </head>
  <body class="shared-page scroll-shell">
    <div
      id="article-reading-progress"
      class="reading-progress hidden"
      role="progressbar"
      aria-label="{{progress.label}}"
      data-i18n-aria-label="progress.label"
      aria-valuemin="0"
      aria-valuemax="100"
      aria-valuenow="0"
      aria-valuetext="{{progress.zero}}"
      data-i18n-aria-valuetext="progress.zero"
    >
      <div class="reading-progress-value"></div>
    </div>
    <div class="page-scroll">
      <header class="nav">
        <span class="brand" aria-label="Podcast2Article">
          <span class="brand-mark" aria-hidden="true"
            ><i></i><i></i><i></i><i></i
          ></span>
          <span>Podcast<span>2</span>Article</span>
        </span>
        <span class="shared-label" data-i18n="shared.kicker"
          >{{shared.kicker}}</span
        >
      </header>
      <main id="shared-main" aria-live="polite">
        <section
          id="shared-loading"
          class="shared-loading"
          data-i18n="shared.loading"
        >
          {{shared.loading}}
        </section>
        <section id="shared-result" class="hidden">
          <button
            id="continue-reading"
            class="continue-reading hidden"
            type="button"
            aria-label="{{readingPosition.resumeLabel}}"
            data-i18n-aria-label="readingPosition.resumeLabel"
          >
            <span data-i18n="readingPosition.resume"
              >{{readingPosition.resume}}</span
            >
            <strong id="continue-reading-heading"></strong>
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="m9 18 6-6-6-6" />
            </svg>
          </button>
          <div id="episode-hero" class="episode-hero"></div>
          <div class="shared-save-actions article-actions hidden">
            <button type="button" data-save-shared data-i18n="shared.save">
              {{shared.save}}
            </button>
            <a data-open-saved class="hidden" data-i18n="shared.openSaved"
              >{{shared.openSaved}}</a
            >
            <span data-save-status role="status"></span>
          </div>
          <div class="shared-source">
            <div>
              <span class="kicker" data-i18n="shared.listen"
                >{{shared.listen}}</span
              >
              <p data-i18n="shared.source">{{shared.source}}</p>
            </div>
            <div class="source-audio-home">
              <audio id="audio" controls preload="metadata"></audio>
            </div>
          </div>
          <div class="content-layout shared-layout">
            <article id="article" class="article"></article>
            <aside class="side-nav">
              <div>
                <span id="toc-title" data-i18n="article.contents"
                  >{{article.contents}}</span
                >
                <nav id="toc" aria-labelledby="toc-title"></nav>
              </div>
            </aside>
          </div>
          <div class="shared-save-actions article-actions hidden">
            <button type="button" data-save-shared data-i18n="shared.save">
              {{shared.save}}
            </button>
            <a data-open-saved class="hidden" data-i18n="shared.openSaved"
              >{{shared.openSaved}}</a
            >
            <span data-save-status role="status"></span>
          </div>
        </section>
        <section id="shared-error" class="shared-error hidden">
          <span class="kicker" data-i18n="notFound.kicker"
            >{{notFound.kicker}}</span
          >
          <h1 data-i18n="notFound.heading">{{notFound.heading}}</h1>
          <p data-i18n="notFound.description">{{notFound.description}}</p>
        </section>
      </main>
      <footer>
        <span>Podcast2Article</span
        ><span data-i18n="shared.footer">{{shared.footer}}</span>
      </footer>
    </div>

    <dialog
      id="source-preview"
      class="source-preview"
      aria-labelledby="source-preview-title"
    >
      <div class="source-preview-header">
        <h2 id="source-preview-title" data-i18n="sourcePreview.title">
          {{sourcePreview.title}}
        </h2>
        <button
          type="button"
          data-preview-close
          autofocus
          data-i18n="sourcePreview.return"
        >
          {{sourcePreview.return}}
        </button>
      </div>
      <p class="source-preview-metadata" data-preview-metadata></p>
      <p class="source-preview-transcript" data-preview-transcript hidden></p>
      <div class="source-preview-player" data-preview-player></div>
      <p class="source-preview-status" data-preview-status role="status"></p>
    </dialog>
  </body>
</html>
